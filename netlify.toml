[build]
  base = "."
  command = "npm run build"
  publish = ".next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ app/ components/ lib/ styles/ package.json next.config.* netlify.toml"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/clerk-proxy/*"
  to = "https://frontend-api.clerk.services/:splat"
  status = 200
  force = true
