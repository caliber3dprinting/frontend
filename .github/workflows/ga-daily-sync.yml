name: GA4 daily sync

# Baja las métricas de GA4 del día anterior a Sanity.
# 09:00 UTC = 04:00 America/Cancun, ya cerrado el día anterior en GA4.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ga-sync endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/ga-sync"
